name: Supabase Backup

on:
  schedule:
    # 06:00 UTC = 03:00 America/Sao_Paulo
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django backup export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: 'False'
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL ausente. GitHub → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          if [ -z "$SECRET_KEY" ]; then
            echo "::error::Secret SECRET_KEY ausente (use o mesmo valor do serviço adcapital-api no Render)."
            exit 1
          fi
          python fast_backup.py

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-adcapital-${{ github.run_id }}
          path: backup_adcapital.json
          retention-days: 30
          if-no-files-found: error
