[pytest]
DJANGO_SETTINGS_MODULE = adcapitalcore.settings
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*
testpaths =
    membros/tests
    financeiro
    agenda/tests
    analytics/tests
addopts =
    -q
    --cov=membros
    --cov=financeiro
    --cov=agenda
    --cov=analytics
    --cov-report=term-missing:skip-covered
    --cov-fail-under=35
